name: Check pull request
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run_tests:
    name: "Run unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - &setup_go
        name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.x'

      - &labels
        name: Get PR labels
        id: pr-labels
        uses: joerick/pr-labels-action@v1.0.9
      
      - name: Check make go-deps/tidy ran before commit
        run: make go-deps/ci/check/no-tidy

      - name: Run tests
        run: |
          if [ -n "$GITHUB_PR_LABEL_TEST_NO_INTEGRATION" ]; then
            echo -e '\033[1;33m!!!\033[0m'
            echo -e "\033[1;33mIntegration tests were skipped by label 'test/no-integration'\033[0m"
            echo -e '\033[1;33m!!!\033[0m'
          
            make test/no-integration
          else
            make test
          fi

      - name: Cleanup after failed
        if: failure()
        run: make clean/test

  license_validation:
    name: "Validate that license added to all files"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout_step
      - *setup_go
      - name: Run validation
        run: make validation/license

  lint:
    name: "Lint golang code"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout_step
      - name: Run lint
        run: make lint